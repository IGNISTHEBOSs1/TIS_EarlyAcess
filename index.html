<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic · The Improvement System | Early Access</title>
    <meta
      name="description"
      content="Kinetic — Quiet, deterministic personal trajectory engine. Local-first execution, ±10% mathematical buffer cone, and zero data harvesting."
    />
    <meta name="author" content="Kinetic" />
    <meta name="theme-color" content="#090A0F" />

    <!-- Open Graph -->
    <meta property="og:title" content="Kinetic · The Improvement System | Early Access" />
    <meta
      property="og:description"
      content="A quieter way to become who you're trying to be. Local-first encrypted browser vault, ±10% trajectory buffer, and strict 1 Focus + 2 Routines."
    />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Referrer Policy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Google Fonts: Plus Jakarta Sans (Display), Inter (Body), JetBrains Mono (Technical Chrome) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <!-- Theme initialization script (zero flash) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tis-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          /* Fallback */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Liquid Glass Optical Refraction SVG Filters -->
    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute; width:0; height:0; pointer-events:none; overflow:hidden;" aria-hidden="true">
      <defs>
        <filter id="liquid-glass-lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feComponentTransfer in="displaced" result="brightened">
            <feFuncR type="linear" slope="1.06" />
            <feFuncG type="linear" slope="1.06" />
            <feFuncB type="linear" slope="1.06" />
          </feComponentTransfer>
        </filter>
        <filter id="liquid-glass-fluid" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
          <feTurbulence type="turbulence" baseFrequency="0.02 0.02" numOctaves="3" result="wave" />
          <feDisplacementMap in="SourceGraphic" in2="wave" scale="9" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feComponentTransfer in="displaced">
            <feFuncR type="linear" slope="1.08" />
            <feFuncG type="linear" slope="1.08" />
            <feFuncB type="linear" slope="1.08" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
